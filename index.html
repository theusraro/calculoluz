<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Energia - Loteamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-100 transition-colors duration-300">

  <!-- ==================== TELA DE LOGIN ==================== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full max-w-md">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800 dark:text-white">Controle de Energia</h1>
        <p class="text-gray-500 dark:text-gray-400 mt-2">Loteamento • Juiz de Fora</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium mb-1">Usuário</label>
          <input type="text" id="loginUser" required
                 class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none"
                 placeholder="Digite seu usuário" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Senha</label>
          <input type="password" id="loginPass" required
                 class="w-full border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 bg-white dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none"
                 placeholder="Digite sua senha" />
        </div>

        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition">
          Entrar
        </button>
      </form>

      <p id="loginError" class="text-red-500 text-sm text-center mt-4 hidden"></p>
    </div>
  </div>

  <!-- ==================== SISTEMA PRINCIPAL ==================== -->
  <div id="appScreen" class="hidden">
    <div class="max-w-5xl mx-auto p-4 md:p-8">

      <!-- Header -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-5 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
          <h1 class="text-2xl font-bold">Controle de Energia</h1>
          <p class="text-sm text-gray-500 dark:text-gray-400">
            Logado como: <span id="userLogged" class="font-semibold text-blue-600 dark:text-blue-400"></span>
          </p>
        </div>

        <div class="flex items-center gap-3 flex-wrap justify-center">
          <!-- Tema -->
          <button onclick="toggleTheme()"
                  class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
            <span id="themeIcon">🌙</span>
            <span id="themeText">Modo Escuro</span>
          </button>

          <!-- Tarifa -->
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium">Tarifa R$/kWh:</span>
            <input id="tarifa" type="number" step="0.00000001" value="1.18002201"
                   class="w-36 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-right font-mono bg-white dark:bg-gray-700"
                   onchange="salvarTarifa()" />
          </div>

          <!-- Sair -->
          <button onclick="logout()"
                  class="bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 hover:bg-red-200 dark:hover:bg-red-900/60 px-4 py-2 rounded-lg text-sm font-medium">
            Sair
          </button>
        </div>
      </div>

      <!-- Adicionar Pessoa -->
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-5 mb-6">
        <h2 class="font-semibold mb-3">Cadastrar Pessoa / Lote</h2>
        <div class="flex gap-3">
          <input id="novaPessoa" type="text" placeholder="Ex: RODRIGO"
                 class="flex-1 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700" />
          <button onclick="adicionarPessoa()"
                  class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium">
            Cadastrar
          </button>
        </div>
      </div>

      <!-- Lista de Pessoas -->
      <div id="listaPessoas" class="space-y-4"></div>

      <!-- Total Geral -->
      <div class="bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 rounded-2xl p-6 mt-8">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4">
          <div>
            <p class="text-green-700 dark:text-green-400 font-medium">Total a receber (mês atual)</p>
            <p id="totalGeral" class="text-3xl font-bold text-green-800 dark:text-green-300">R$ 0,00</p>
          </div>
          <div class="text-right">
            <p class="text-sm text-green-600 dark:text-green-400">Total de kWh</p>
            <p id="totalKwh" class="text-2xl font-semibold text-green-700 dark:text-green-300">0 kWh</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
